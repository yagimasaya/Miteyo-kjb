<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>父への掲示板</title>
<style>
        body {
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
            width: 100vw;
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box; /* パディングを含めて100vhに収める */
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 15px;
        }
        #message-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            padding-bottom: 40px; /* ★ここを追加：一番下のメッセージが隠れないように余白を作る */
            box-sizing: border-box;
        }
        .message-item {
            background: #f7f9fc;
            padding: 20px 25px;
            border-radius: 16px;
            border-left: 6px solid #06c755;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .sender-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #06c755;
        }
        .message-time {
            font-size: 1.0rem;
            color: #666;
        }
        .message-text {
            font-size: 2.2rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>伝言板</h2>
        <div id="message-container">
            <div class="message-item">
                <p class="message-text">読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJoDJB4stO6NF3uq0EKv0YrwGbwNwDHeyyUnsc6V4WM0AK3oO-oB23QmFILBjcAg/exec";
        
        let lastDataString = "";

        async function fetchMessages() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                
                const dataString = JSON.stringify(data);
                if (dataString !== lastDataString) {
                    lastDataString = dataString;
                    
                    const container = document.getElementById('message-container');
                    container.innerHTML = "";
                    
                    data.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'message-item';
                        
                        div.innerHTML = `
                            <div class="message-header">
                                <span class="sender-name">${msg.name} さん</span>
                                <span class="message-time">${msg.time || ''}</span>
                            </div>
                            <p class="message-text">${msg.text}</p>
                        `;
                        container.appendChild(div);
                    });
                    
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.error("取得エラー:", error);
            }
        }

        fetchMessages();
        setInterval(fetchMessages, 10000);
    </script>
</body>
</html>
