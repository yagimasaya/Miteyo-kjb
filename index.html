<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>父への掲示板 ＆ 通話</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #blackout-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: black;
            z-index: 9999;
            display: none;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
            width: 100vw;
            max-width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 15px;
            flex-shrink: 0;
        }
        #message-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            padding-bottom: 80px;
            box-sizing: border-box;
        }
        .message-item {
            background: #f7f9fc;
            padding: 20px 25px;
            border-radius: 16px;
            border-left: 6px solid #06c755;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .message-content {
            flex-grow: 1;
            margin-right: 15px;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .sender-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #06c755;
        }
        .message-time {
            font-size: 1.0rem;
            color: #666;
        }
        .message-text {
            font-size: 2.2rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
        }
        .ack-btn {
            background-color: #06c755;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .ack-btn:active {
            transform: scale(0.95);
        }

        .message-item.acknowledged {
            background: #e2e8f0 !important;
            border-left-color: #cbd5e1 !important;
            opacity: 0.7;
        }
        .message-item.acknowledged .sender-name,
        .message-item.acknowledged .message-text,
        .message-item.acknowledged .message-time {
            color: #64748b !important;
        }
        .ack-btn.acknowledged {
            background-color: #94a3b8 !important;
            box-shadow: none;
        }

        /* オーバーレイ関連 */
        #call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 8888;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        
        #btnAnswer {
            width: 85vw;
            max-width: 500px;
            height: 45vh;
            max-height: 380px;
            background-color: #06c755;
            color: white;
            font-size: 3.5rem;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(6, 199, 85, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .phone-icon {
            font-size: 5rem;
            line-height: 1;
        }
        
        /* 掲示板に戻るボタン（デザイン強化版） */
        .emergency-close {
            position: absolute;
            bottom: 40px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #333333;
            background-color: #ffffff;
            border: none;
            border-radius: 35px;
            padding: 18px 40px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s, transform 0.1s;
        }

        .emergency-close:active {
            transform: scale(0.95);
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div id="blackout-screen"></div>

    <div class="card">
        <h2>伝言板</h2>
        <div id="message-container">
            <div class="message-item">
                <div class="message-content">
                    <p class="message-text">読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="call-overlay">
        <a id="btnAnswer" href="#" target="_blank" rel="noopener noreferrer" onclick="handleAnswerClick(event)">
            <span class="phone-icon">📞</span>
            <span>電話に出て！</span>
        </a>
        
        <!-- 見やすいボタン構造に変更 -->
        <button class="emergency-close" onclick="hideOverlayLocally()">掲示板に戻る</button>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJoDJB4stO6NF3uq0EKv0YrwGbwNwDHeyyUnsc6V4WM0AK3oO-oB23QmFILBjcAg/exec";

        let lastDataString = "";
        let lastMeetUrl = "";
        let localHideCall = false;

        async function fetchMessages() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                
                // 1. ブラックアウト制御
                const blackoutDiv = document.getElementById('blackout-screen');
                if (data.isBlackout) {
                    blackoutDiv.style.display = "block";
                    return;
                } else {
                    blackoutDiv.style.display = "none";
                }

                // 2. 通話フラグの監視
                const callOverlay = document.getElementById('call-overlay');
                const btnAnswer = document.getElementById('btnAnswer');

                if (data.isCalling) {
                    const currentUrl = data.meetUrl || "https://meet.google.com/jma-rmrf-uhv";
                    
                    if (currentUrl !== lastMeetUrl) {
                        lastMeetUrl = currentUrl;
                        localHideCall = false;
                    }

                    if (!localHideCall) {
                        callOverlay.style.display = "flex";
                        btnAnswer.href = currentUrl;
                    } else {
                        callOverlay.style.display = "none";
                    }
                } else {
                    callOverlay.style.display = "none";
                    localHideCall = false;
                }
                
                // 3. メッセージ描画処理
                const messages = data.messages || [];
                const checkData = {
                    messages: messages,
                    acknowledgedIds: data.acknowledgedIds,
                    isCalling: data.isCalling,
                    meetUrl: data.meetUrl
                };
                const dataString = JSON.stringify(checkData);

                if (dataString !== lastDataString) {
                    lastDataString = dataString;
                    
                    const container = document.getElementById('message-container');
                    container.innerHTML = "";
                    
                    const ackIds = data.acknowledgedIds || [];

                    messages.forEach((msg) => {
                        const msgId = `${msg.name}_${msg.time}_${msg.text}`;
                        const isAck = ackIds.includes(msgId);

                        const div = document.createElement('div');
                        div.className = `message-item ${isAck ? 'acknowledged' : ''}`;
                        
                        div.innerHTML = `
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="sender-name">${msg.name || ''} さん</span>
                                    <span class="message-time">${msg.time || ''}</span>
                                </div>
                                <p class="message-text">${msg.text || ''}</p>
                            </div>
                            <button class="ack-btn ${isAck ? 'acknowledged' : ''}" onclick="toggleAcknowledge(this, '${msgId}')">
                                ${isAck ? '済み' : '了解'}
                            </button>
                        `;
                        container.appendChild(div);
                    });
                    
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.error("取得エラー:", error);
            }
        }

        function handleAnswerClick(event) {
            localHideCall = true;
            setTimeout(() => {
                document.getElementById('call-overlay').style.display = 'none';
            }, 300);
        }

        window.hideOverlayLocally = function() {
            localHideCall = true;
            document.getElementById('call-overlay').style.display = 'none';
        }

        window.toggleAcknowledge = async function(btnElement, msgId) {
            const itemElement = btnElement.closest('.message-item');
            const isCurrentlyAck = itemElement.classList.contains('acknowledged');
            if (isCurrentlyAck) {
                itemElement.classList.remove('acknowledged');
                btnElement.classList.remove('acknowledged');
                btnElement.textContent = '了解';
            } else {
                itemElement.classList.add('acknowledged');
                btnElement.classList.add('acknowledged');
                btnElement.textContent = '済み';
            }

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        payload: JSON.stringify({
                            action: 'toggleAcknowledge',
                            msgId: msgId
                        })
                    })
                });
                fetchMessages();
            } catch (error) {
                console.error("送信エラー:", error);
            }
        };

        fetchMessages();
        setInterval(fetchMessages, 10000);
    </script>
</body>
</html>
