<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>父への掲示板</title>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 80%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 15px;
        }
        /* メッセージが溜まっていくスクロールエリア */
        #message-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
        }
        /* 個別のメッセージカード */
        .message-item {
            background: #f7f9fc;
            padding: 20px 25px;
            border-radius: 16px;
            font-size: 2.2rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            border-left: 6px solid #06c755; /* LINEカラーのアクセント */
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>伝言板</h2>
        <div id="message-container">
            <div class="message-item">読み込み中...</div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJoDJB4stO6NF3uq0EKv0YrwGbwNwDHeyyUnsc6V4WM0AK3oO-oB23QmFILBjcAg/exec";
        
        let lastDisplayedMessage = ""; // 直近に表示したメッセージを記憶

        async function fetchMessage() {
            try {
                const response = await fetch(GAS_API_URL);
                const text = await response.text();
                
                if (text && text.trim() !== "" && text !== lastDisplayedMessage) {
                    lastDisplayedMessage = text;
                    
                    const container = document.getElementById('message-container');
                    
                    // 初回の「読み込み中...」があれば消す
                    if (container.innerHTML.includes("読み込み中...")) {
                        container.innerHTML = "";
                    }
                    
                    // 新しいメッセージの要素を作成して追加
                    const div = document.createElement('div');
                    div.className = 'message-item';
                    div.innerText = text;
                    container.appendChild(div);
                    
                    // 一番下（最新）に自動スクロール
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.error("取得エラー:", error);
            }
        }

        // 初回取得 ＆ 10秒ごとに自動チェック
        fetchMessage();
        setInterval(fetchMessage, 10000);
    </script>
</body>
</html>
