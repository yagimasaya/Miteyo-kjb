<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>父への掲示板</title>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 60px 80px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 85%;
        }
        h1 {
            font-size: 3.5rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="msg">読み込み中...</h1>
    </div>

    <script>
        // ★末尾に ?type=html を付けない、正しいGASのURLを設定してください
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJvDJB4st06NF3ug0EKv0YrwGbwNvDHeyyUnsc6V4WM0AK3o0-o823qMFILbjcAg/exec";
        
        let lastMessage = ""; // 直近のメッセージを保持する変数

        async function fetchMessage() {
            try {
                const response = await fetch(GAS_API_URL);
                const text = await response.text();
                
                // 何かしらの文字が取得できた場合のみ更新する
                if (text && text.trim() !== "") {
                    lastMessage = text;
                    document.getElementById('msg').innerText = lastMessage;
                }
            } catch (error) {
                console.error("取得エラー:", error);
                // 通信エラーが起きても、直前のメッセージを画面に残し続ける
                if (lastMessage) {
                    document.getElementById('msg').innerText = lastMessage;
                }
            }
        }

        // 初回取得 ＆ 10秒ごとに自動でバックグラウンド取得・更新
        fetchMessage();
        setInterval(fetchMessage, 10000);
    </script>
</body>
</html>
