<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>父への伝言板</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 消灯（ブラックアウト）画面 */
        #blackout-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: black;
            z-index: 9999;
            display: none;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 0;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 2.0rem;
            text-align: center;
            border-bottom: 3px solid #06c755;
            padding-bottom: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        /* ★新機能：「ビデオ通話して」ボタンのスタイル */
        .call-request-btn {
            background-color: #e53e3e;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .call-request-btn:active {
            transform: scale(0.97);
            background-color: #c53030;
        }

        #message-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            padding-bottom: 20px;
            box-sizing: border-box;
        }

        .message-item {
            background: #f7f9fc;
            padding: 20px 25px;
            border-radius: 16px;
            border-left: 8px solid #06c755;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .message-content {
            flex-grow: 1;
            margin-right: 15px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .sender-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #06c755;
        }

        .message-time {
            font-size: 1.1rem;
            color: #666;
        }

        .message-text {
            font-size: 2.3rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
            font-weight: 500;
        }

        .ack-btn {
            background-color: #06c755;
            color: white;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .ack-btn:active {
            transform: scale(0.95);
        }

        /* 了解済み（既読）スタイル */
        .message-item.acknowledged {
            background: #e2e8f0 !important;
            border-left-color: #cbd5e1 !important;
            opacity: 0.65;
        }
        .message-item.acknowledged .sender-name,
        .message-item.acknowledged .message-text,
        .message-item.acknowledged .message-time {
            color: #64748b !important;
        }
        .ack-btn.acknowledged {
            background-color: #94a3b8 !important;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <!-- 消灯（ブラックアウト）画面 -->
    <div id="blackout-screen"></div>

    <div class="card">
        <h2>父への伝言板</h2>

        <!-- ★画面上部：「ビデオ通話して」ボタン -->
        <button class="call-request-btn" onclick="sendVideoCallRequest(this)">
            <span>📹</span>
            <span>ビデオ通話して</span>
        </button>

        <!-- メッセージ一覧 -->
        <div id="message-container">
            <div class="message-item">
                <div class="message-content">
                    <p class="message-text">データを読み込んでいます...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJoDJB4stO6NF3uq0EKv0YrwGbwNwDHeyyUnsc6V4WM0AK3oO-oB23QmFILBjcAg/exec";

        let lastDataString = "";
        let localAckIds = new Set();

        async function fetchMessages() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();

                // 1. 消灯（ブラックアウト）制御
                const blackoutDiv = document.getElementById('blackout-screen');
                if (data.isBlackout) {
                    blackoutDiv.style.display = "block";
                    return;
                } else {
                    blackoutDiv.style.display = "none";
                }

                // 2. メッセージ描画
                const messages = data.messages || [];
                const ackIdsFromGAS = data.acknowledgedIds || [];

                ackIdsFromGAS.forEach(id => localAckIds.add(id));

                const checkData = {
                    messages: messages,
                    acknowledgedIds: Array.from(localAckIds)
                };
                const dataString = JSON.stringify(checkData);

                if (dataString !== lastDataString) {
                    lastDataString = dataString;
                    
                    const container = document.getElementById('message-container');
                    container.innerHTML = "";

                    messages.forEach((msg) => {
                        const msgId = `${msg.name}_${msg.time}_${msg.text}`;
                        const isAck = localAckIds.has(msgId);

                        const div = document.createElement('div');
                        div.className = `message-item ${isAck ? 'acknowledged' : ''}`;

                        div.innerHTML = `
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="sender-name">${msg.name || ''} さん</span>
                                    <span class="message-time">${msg.time || ''}</span>
                                </div>
                                <p class="message-text">${msg.text || ''}</p>
                            </div>
                            <button class="ack-btn ${isAck ? 'acknowledged' : ''}" onclick="toggleAcknowledge(this, '${msgId}')">
                                ${isAck ? '済み' : '了解'}
                            </button>
                        `;
                        container.appendChild(div);
                    });

                    container.scrollTop = container.scrollHeight;
                }

            } catch (error) {
                console.error("データ取得エラー:", error);
            }
        }

        // ★「ビデオ通話して」ボタン送信処理
        async function sendVideoCallRequest(btnElement) {
            btnElement.disabled = true;
            btnElement.style.opacity = "0.6";

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify({
                        action: 'addMessage',
                        name: '政一',
                        text: '政一がビデオ通話を求めている'
                    })
                });

                // 即座に最新メッセージを取得して更新
                setTimeout(() => {
                    fetchMessages();
                    btnElement.disabled = false;
                    btnElement.style.opacity = "1";
                }, 800);

            } catch (error) {
                console.error("ビデオ通話要求の送信エラー:", error);
                btnElement.disabled = false;
                btnElement.style.opacity = "1";
            }
        }

        async function toggleAcknowledge(btnElement, msgId) {
            const itemElement = btnElement.closest('.message-item');
            const isCurrentlyAck = itemElement.classList.contains('acknowledged');

            if (isCurrentlyAck) {
                itemElement.classList.remove('acknowledged');
                btnElement.classList.remove('acknowledged');
                btnElement.textContent = '了解';
                localAckIds.delete(msgId);
            } else {
                itemElement.classList.add('acknowledged');
                btnElement.classList.add('acknowledged');
                btnElement.textContent = '済み';
                localAckIds.add(msgId);
            }

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify({
                        action: 'toggleAcknowledge',
                        msgId: msgId
                    })
                });
            } catch (error) {
                console.error("了解トグル送信エラー:", error);
            }
        }

        fetchMessages();
        setInterval(fetchMessages, 10000);
    </script>
</body>
</html>
