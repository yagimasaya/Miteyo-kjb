<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>父への掲示板</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 暗転用オーバーレイ */
        #blackout-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: black;
            z-index: 9999;
            display: none;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
            width: 100vw;
            max-width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 15px;
            flex-shrink: 0;
        }
        #message-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            padding-bottom: 80px;
            box-sizing: border-box;
        }
        .message-item {
            background: #f7f9fc;
            padding: 20px 25px;
            border-radius: 16px;
            border-left: 6px solid #06c755;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        /* メッセージ本文部分のラッパー */
        .message-content {
            flex-grow: 1;
            margin-right: 15px;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .sender-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #06c755;
        }
        .message-time {
            font-size: 1.0rem;
            color: #666;
        }
        .message-text {
            font-size: 2.2rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
        }
        /* ★「了解」丸ボタンのスタイル */
        .ack-btn {
            background-color: #06c755;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .ack-btn:active {
            transform: scale(0.95);
        }

        /* ★既読（済み）になったときのスタイル（グレーアウト） */
        .message-item.acknowledged {
            background: #e2e8f0 !important;
            border-left-color: #cbd5e1 !important;
            opacity: 0.7;
        }
        .message-item.acknowledged .sender-name,
        .message-item.acknowledged .message-text,
        .message-item.acknowledged .message-time {
            color: #64748b !important;
        }
        .ack-btn.acknowledged {
            background-color: #94a3b8 !important;
            cursor: default;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="blackout-screen"></div>

    <div class="card">
        <h2>伝言板</h2>
        <div id="message-container">
            <div class="message-item">
                <div class="message-content">
                    <p class="message-text">読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJoDJB4stO6NF3uq0EKv0YrwGbwNwDHeyyUnsc6V4WM0AK3oO-oB23QmFILBjcAg/exec";
        
        let lastDataString = "";

        // 保存された既読状態（IDのリスト）を取得する
        function getAcknowledgedIds() {
            try {
                const saved = localStorage.getItem('acknowledged_msgs');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                return [];
            }
        }

        // 既読状態を保存する
        function saveAcknowledgedId(msgId) {
            const ids = getAcknowledgedIds();
            if (!ids.includes(msgId)) {
                ids.push(msgId);
                localStorage.setItem('acknowledged_msgs', JSON.stringify(ids));
            }
        }

        async function fetchMessages() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                
                const blackoutDiv = document.getElementById('blackout-screen');
                if (data.isBlackout) {
                    blackoutDiv.style.display = "block";
                    return;
                } else {
                    blackoutDiv.style.display = "none";
                }
                
                const dataString = JSON.stringify(data.messages);
                if (dataString !== lastDataString) {
                    lastDataString = dataString;
                    
                    const container = document.getElementById('message-container');
                    container.innerHTML = "";
                    
                    const ackIds = getAcknowledgedIds();

                    data.messages.forEach((msg, index) => {
                        // メッセージを一意に特定するための簡易ID（名前+時間+テキストの組み合わせ）
                        const msgId = `${msg.name}_${msg.time}_${msg.text}`;
                        const isAck = ackIds.includes(msgId);

                        const div = document.createElement('div');
                        div.className = `message-item ${isAck ? 'acknowledged' : ''}`;
                        
                        div.innerHTML = `
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="sender-name">${msg.name} さん</span>
                                    <span class="message-time">${msg.time || ''}</span>
                                </div>
                                <p class="message-text">${msg.text}</p>
                            </div>
                            <button class="ack-btn ${isAck ? 'acknowledged' : ''}" onclick="acknowledgeMessage(this, '${msgId}')">
                                ${isAck ? '済み' : '了解'}
                            </button>
                        `;
                        container.appendChild(div);
                    });
                    
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.error("取得エラー:", error);
            }
        }

        // 「了解」ボタンが押されたときの処理
        window.acknowledgeMessage = function(btnElement, msgId) {
            saveAcknowledgedId(msgId);
            
            // 該当するメッセージのカード全体とボタンにクラスを追加してグレーアウト
            const itemElement = btnElement.closest('.message-item');
            itemElement.classList.add('acknowledged');
            btnElement.classList.add('acknowledged');
            btnElement.textContent = '済み';
        };

        fetchMessages();
        setInterval(fetchMessages, 10000);
    </script>
</body>
</html>
