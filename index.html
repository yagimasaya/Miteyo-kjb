<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>父への掲示板 ＆ 通話</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #blackout-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: black;
            z-index: 9999;
            display: none;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
            width: 100vw;
            max-width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 15px;
            flex-shrink: 0;
        }
        #message-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            padding-bottom: 80px;
            box-sizing: border-box;
        }
        .message-item {
            background: #f7f9fc;
            padding: 20px 25px;
            border-radius: 16px;
            border-left: 6px solid #06c755;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .message-content {
            flex-grow: 1;
            margin-right: 15px;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .sender-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #06c755;
        }
        .message-time {
            font-size: 1.0rem;
            color: #666;
        }
        .message-text {
            font-size: 2.2rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
            margin: 0;
        }
        .ack-btn {
            background-color: #06c755;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .ack-btn:active {
            transform: scale(0.95);
        }

        .message-item.acknowledged {
            background: #e2e8f0 !important;
            border-left-color: #cbd5e1 !important;
            opacity: 0.7;
        }
        .message-item.acknowledged .sender-name,
        .message-item.acknowledged .message-text,
        .message-item.acknowledged .message-time {
            color: #64748b !important;
        }
        .ack-btn.acknowledged {
            background-color: #94a3b8 !important;
            box-shadow: none;
        }

        /* ==========================================
           通話画面（Google Meet）用のオーバーレイ層
           ========================================== */
        #call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #000;
            z-index: 8888; /* 掲示板より手前、ブラックアウトより後ろ */
            display: none; /* 初期状態は非表示 */
            flex-direction: column;
        }
        #meetFrame {
            width: 100%;
            height: 75%; /* 画面上部75%にGoogle Meetを表示 */
            border: none;
        }
        #hangup-bar {
            width: 100%;
            height: 25%; /* 画面下1/4に終了ボタンバー */
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #333;
            box-sizing: border-box;
        }
        #btnHangup {
            width: 85%;
            height: 75%;
            background-color: #D32F2F; /* 赤色の切断ボタン */
            color: white;
            font-size: 2.2rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #btnHangup:active {
            background-color: #B71C1C;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="blackout-screen"></div>

    <!-- 普段の掲示板画面 -->
    <div class="card">
        <h2>伝言板</h2>
        <div id="message-container">
            <div class="message-item">
                <div class="message-content">
                    <p class="message-text">読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 通話オーバーレイ画面（発信時に出現） -->
    <div id="call-overlay">
        <iframe id="meetFrame" src=""></iframe>
        <div id="hangup-bar">
            <button id="btnHangup" onclick="endCall()">📞 通話を終了する</button>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQqyTJoDJB4stO6NF3uq0EKv0YrwGbwNwDHeyyUnsc6V4WM0AK3oO-oB23QmFILBjcAg/exec";
        
        // 【設定】ご自身の固定Google MeetのURL
        const FIXED_MEET_URL = "https://meet.google.com/abc-defg-hij"; // ←ここに実際の固定URLを設定してください

        let lastDataString = "";
        let isCurrentlyInCall = false;

        async function fetchMessages() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                
                // 1. ブラックアウト制御
                const blackoutDiv = document.getElementById('blackout-screen');
                if (data.isBlackout) {
                    blackoutDiv.style.display = "block";
                    return;
                } else {
                    blackoutDiv.style.display = "none";
                }

                // 2. 通話開始の検知（GASから `isCalling: true` が返ってきた場合）
                const callOverlay = document.getElementById('call-overlay');
                const meetFrame = document.getElementById('meetFrame');

                if (data.isCalling) {
                    if (!isCurrentlyInCall) {
                        isCurrentlyInCall = true;
                        meetFrame.src = FIXED_MEET_URL; // Meetを読み込む
                        callOverlay.style.display = "flex"; // 画面に表示
                    }
                } else {
                    if (isCurrentlyInCall) {
                        // こちらから切断していなくて、サーバー側で通話終了になった場合
                        closeCallUI();
                    }
                }
                
                const checkData = {
                    messages: data.messages,
                    acknowledgedIds: data.acknowledgedIds,
                    isCalling: data.isCalling
                };
                const dataString = JSON.stringify(checkData);

                if (dataString !== lastDataString) {
                    lastDataString = dataString;
                    
                    const container = document.getElementById('message-container');
                    container.innerHTML = "";
                    
                    const ackIds = data.acknowledgedIds || [];

                    data.messages.forEach((msg) => {
                        const msgId = `${msg.name}_${msg.time}_${msg.text}`;
                        const isAck = ackIds.includes(msgId);

                        const div = document.createElement('div');
                        div.className = `message-item ${isAck ? 'acknowledged' : ''}`;
                        
                        div.innerHTML = `
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="sender-name">${msg.name} さん</span>
                                    <span class="message-time">${msg.time || ''}</span>
                                </div>
                                <p class="message-text">${msg.text}</p>
                            </div>
                            <button class="ack-btn ${isAck ? 'acknowledged' : ''}" onclick="toggleAcknowledge(this, '${msgId}')">
                                ${isAck ? '済み' : '了解'}
                            </button>
                        `;
                        container.appendChild(div);
                    });
                    
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.error("取得エラー:", error);
            }
        }

        // 高齢者が画面下の「通話を終了する」ボタンを押したときの処理
        window.endCall = async function() {
            closeCallUI();

            try {
                // GASへ「通話終了（isCallingをfalseにする）」を通知
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'endCall'
                    })
                });
            } catch (error) {
                console.error("通話終了通知エラー:", error);
            }
        }

        // 通話UIを非表示にしてリセットする内部関数
        function closeCallUI() {
            isCurrentlyInCall = false;
            const callOverlay = document.getElementById('call-overlay');
            const meetFrame = document.getElementById('meetFrame');

            callOverlay.style.display = "none";
            meetFrame.src = ""; // フレームを空にしてカメラ/マイクを確実に切断
        }

        window.toggleAcknowledge = async function(btnElement, msgId) {
            const itemElement = btnElement.closest('.message-item');
            const isCurrentlyAck = itemElement.classList.contains('acknowledged');
            if (isCurrentlyAck) {
                itemElement.classList.remove('acknowledged');
                btnElement.classList.remove('acknowledged');
                btnElement.textContent = '了解';
            } else {
                itemElement.classList.add('acknowledged');
                btnElement.classList.add('acknowledged');
                btnElement.textContent = '済み';
            }

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'toggleAcknowledge',
                        msgId: msgId
                    })
                });
                fetchMessages();
            } catch (error) {
                console.error("送信エラー:", error);
            }
        };

        fetchMessages();
        setInterval(fetchMessages, 10000); // 10秒ごとにGASの状態をチェック
    </script>
</body>
</html>
